
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lembretemedicamentos.app'
    compileSdk 36

    def keystore = System.getenv('MEU_REMEDIO_KEYSTORE')
    if (keystore) {
        signingConfigs {
            distribuicao {
                storeFile file(keystore)
                storePassword System.getenv('MEU_REMEDIO_STORE_PASSWORD')
                keyAlias System.getenv('MEU_REMEDIO_KEY_ALIAS')
                keyPassword System.getenv('MEU_REMEDIO_KEY_PASSWORD')
            }
        }
        buildTypes.release.signingConfig = signingConfigs.distribuicao
    }

    buildTypes {
        debug {
            applicationIdSuffix '.teste'
            manifestPlaceholders = [nomeAplicativo: 'Meu Remédio (Teste)']
        }
    }

    defaultConfig {
        manifestPlaceholders = [nomeAplicativo: 'Meu Remédio']
        applicationId 'com.lembretemedicamentos.app'
        minSdk 23
        targetSdk 36
        versionCode 4
        versionName '1.3'
    }
}

def prepararHtmlIdoso = tasks.register('prepararHtmlIdoso', Sync) {
    from(rootProject.file('index.html'))
    into(layout.buildDirectory.dir('generated/assets/idoso'))
}

android.sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/assets/idoso'))
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn(prepararHtmlIdoso) }
